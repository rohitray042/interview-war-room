services:
  - type: web
    name: interview-war-room
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: WAR_ROOM_STORAGE_MODE
        value: browser
      - key: WAR_ROOM_SERVE_FRONTEND
        value: "true"
      - key: WAR_ROOM_ACCESS_PASSWORD
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
